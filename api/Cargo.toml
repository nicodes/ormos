[package]
name = "ormos-api"
version = "0.2.14"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = "=0.8.9"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
http-body = "1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "tokio", "service"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }
yawc = { version = "=0.5.0", default-features = false, features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
