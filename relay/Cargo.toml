[package]
name = "ormos-relay"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chacha20poly1305 = { version = "0.11.0", optional = true }
data-encoding = { version = "2.11.1", optional = true }
getrandom = { version = "0.4.3", optional = true }
hkdf = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }
zeroize = { version = "1.9.1", optional = true }

futures = { version = "0.3.32", optional = true }
tokio = { version = "1.52.3", features = ["io-util", "net", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }
yamux = { version = "0.14.1", optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }

[features]
default = ["seal", "transport"]
seal = ["dep:chacha20poly1305", "dep:data-encoding", "dep:getrandom", "dep:hkdf", "dep:sha2", "dep:x25519-dalek", "dep:zeroize"]
transport = ["dep:futures", "dep:tokio", "dep:tokio-tungstenite", "dep:yamux"]
