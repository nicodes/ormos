name: Build
description: >
  Everything a release ships: the binary for every platform, archived, with
  checksums.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name — ci / Build, release / Build — rather than as a
  nested "caller / callee" check.

  Shared by CI and Release so a pull request builds exactly what a release
  builds, with no switches between them. The only difference is that one of them
  goes on to publish.

  This replaces two separate copies of the same cross-compile matrix: one in
  ci.yml that built to /tmp and threw the result away, and one in release.yml
  that archived it. They listed the same four targets and nothing kept them in
  step — the CI copy could have gone on passing for a target the release copy
  had stopped building, or the reverse.

  NOTHING LEAVES THE RUNNER. The archives are left in ./dist. Creating the
  release is a step the caller writes out, so nothing named "build" can publish
  as a side effect of being reused — and it has no token to publish with.

  Assumes Go is already set up. See ../test.

inputs:
  version:
    description: >
      What the binary reports for `ormos --version`, baked in with -X.

      Defaults to "dev" rather than being required, because a pull request has
      no version and should not have to invent one — and "dev" is the honest
      answer for a binary built from a working tree that may match no tag.
    required: false
    default: dev

runs:
  using: composite
  steps:
  - name: Build and verify exact release archives
    shell: bash
    run: make build artifact-smoke
    env:
      VERSION: ${{ inputs.version }}
