name: Test
description: >
  Is this commit good. Nothing is built for release here and nothing is
  published; a failure means the code is wrong, not that the pipeline is.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name — ci / Test, release / Test — rather than as a
  nested "caller / callee" check.

  One definition, called by CI and by Release both. Two would drift in a single
  direction: the copy guarding the release gets trimmed to make releases faster,
  until it no longer matches the one people trust on a pull request.

  Assumes Go is already set up. The caller does that, because the toolchain
  version and its cache keys are a property of the job rather than of this step,
  and two actions in one job would otherwise install it twice.

runs:
  using: composite
  steps:
  - name: Verify CLI profile
    shell: bash
    run: make lint test vuln
