name: Test
description: >
  Is this commit good. Nothing is built for release here and nothing is
  published; a failure means the code is wrong, not that the pipeline is.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name — ci / Test, release / Test — rather than as a
  nested "caller / callee" check.

  One definition, called by CI and by Release both. Two would drift in a single
  direction: the copy guarding the release gets trimmed to make releases faster,
  until it no longer matches the one people trust on a pull request.

  Assumes Go is already set up. The caller does that, because the toolchain
  version and its cache keys are a property of the job rather than of this step,
  and two actions in one job would otherwise install it twice.

runs:
  using: composite
  steps:
    # Cheapest first, and the one most likely to be the only thing wrong.
    - name: Go formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt would change these files:"
          echo "$unformatted"
          exit 1
        fi

    - name: Go vet
      shell: bash
      run: go vet ./...

    # -race because this binary runs a relay and the work it coordinates is
    # concurrent, which is exactly the shape that fails only under load.
    #
    # -count=1 because a cached PASS from an earlier run is not evidence about
    # this one.
    - name: Go tests
      shell: bash
      run: go test -race -count=1 ./...

    # Known vulnerabilities in the module graph the binary actually reaches.
    # govulncheck reports only vulns on a path the code calls and exits non-zero
    # when it finds one, so this fails the build on a reachable CVE rather than
    # leaving it to a report nobody reads. Installed from the govulncheck pin in
    # .mise.toml. Last, because it does its own analysis over the build the
    # steps above already warmed.
    - name: govulncheck
      shell: bash
      run: govulncheck ./...
