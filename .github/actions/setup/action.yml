name: Setup
description: >
  The toolchain install, the pin-agreement guard and the Go build cache —
  defined once, used by every job in CI and Release.

  These three steps lived as verbatim inline copies: two on the Linux jobs
  (ci.yml and release.yml) and one more on each darwin job. The pin check is
  the guard that keeps .mise.toml and go.mod honest, and the cache key is
  what decides whether a run compiles from cold. If one copy were ever
  edited — a cache key, a sed expression — the release path and the PR path
  would stop checking the same thing, which is exactly the drift the
  workflow comments warn about. One definition, like build and test.

  A composite action rather than a reusable workflow for the same reason as
  those two: it runs in the caller's job, under the caller's name, rather
  than as a nested "caller / callee" check.

runs:
  using: composite
  steps:
    # mise rather than setup-go, so every repository in the fleet installs
    # its toolchain the same way. The cost is that the Go version now lives
    # in .mise.toml as well as go.mod; the step below is what keeps them
    # honest.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

    # mise installs the Go toolchain from .mise.toml, but go.mod carries its
    # own `go` directive and GOTOOLCHAIN=auto will silently download whatever
    # that asks for -- so a .mise.toml pin that disagrees with go.mod
    # describes nothing: CI reports one version while building against
    # another. A sed comparison, instant and needing nothing installed, so it
    # runs before everything. It is a property of the tree, not of the
    # machine, so it runs on both platforms for the price of a sed.
    - name: Toolchain pins agree
      shell: bash
      run: |
        set -euo pipefail
        mod="$(sed -n 's/^go //p' go.mod | head -n1)"
        pin="$(sed -n 's/^go = "\(.*\)"$/\1/p' .mise.toml | head -n1)"
        if [ -z "$mod" ] || [ -z "$pin" ]; then
          echo "::error::could not read the Go version from go.mod ($mod) or .mise.toml ($pin)"
          exit 1
        fi
        if [ "$(printf '%s\n%s\n' "$mod" "$pin" | sort -V | head -n1)" != "$mod" ]; then
          echo "::error::.mise.toml pins Go $pin but go.mod asks for $mod. CI would build against the older one while GOTOOLCHAIN quietly fetched the newer, so the pin would describe nothing."
          exit 1
        fi
        echo "go.mod wants $mod, .mise.toml pins $pin"

    # What setup-go did for free. mise installs the toolchain and caches
    # nothing else, so this is what stops every run recompiling from cold.
    # The cache directory differs per platform (~/Library/Caches on macOS,
    # ~/.cache on Linux); runner.os is already in the key, so the two
    # platforms never collide.
    - name: Cache Go build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
        restore-keys: |
          go-${{ runner.os }}-
