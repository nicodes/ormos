name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  attestations: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-api:
    name: Native API
    uses: ./.github/workflows/native-api.yml
  ci:
    name: Test
    needs: native-api
    runs-on: ubuntu-24.04
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    timeout-minutes: 45
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Download native APIs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: native-api-*
        path: .artifacts/native-api
        merge-multiple: true
    - name: Check project
      shell: bash
      env:
        ORMOS_BUILD_TARGETS: all
      run: |-
        set -euo pipefail
        mise run check
  macos:
    name: Test (macOS)
    runs-on: macos-latest
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    timeout-minutes: 45
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check source
      shell: bash
      run: |-
        set -euo pipefail
        mise run install
        mise run lint-source
    - name: Check project
      shell: bash
      run: |-
        set -euo pipefail
        mise run install
        mise run test
        mise run vuln
