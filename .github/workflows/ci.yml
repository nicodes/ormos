# Generated cookbook caller. Change recipe data and regenerate.
name: Build & Test
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      cookbook:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  validate:
    uses: nicodes/cookbook/.github/workflows/cookbook-ci.yml@bf42dc5a713550191a0b60cbb5ed7acb4f7c7095
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      cookbook-ref: ${{ inputs.cookbook || 'bf42dc5a713550191a0b60cbb5ed7acb4f7c7095' }}
      source: ${{ inputs.source || github.sha }}
      merge-gate: ${{ vars.COOKBOOK_REQUEST_MERGE == 'enabled' }}
      recipe: rust-cli
      runner: ubuntu-24.04
      timeout-minutes: 45
