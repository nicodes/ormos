# Generated cookbook caller. Change recipe data and regenerate.
name: Build and test
run-name: "Build and test · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || inputs.source || github.ref_name }}"
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-and-test.yml'
      - 'cookbook.toml'
      - 'mise.toml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/.cargo/config.toml'
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      cookbook:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1-Linux-x86_64
            runner: ubuntu-24.04
            platform: Linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            timeout_minutes: 75
          - id: 1-Linux-arm64
            runner: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            timeout_minutes: 30
          - id: 1-Darwin-x86_64
            runner: macos-15-intel
            platform: Darwin
            arch: x86_64
            target: x86_64-apple-darwin
            timeout_minutes: 30
          - id: 1-Darwin-arm64
            runner: macos-15
            platform: Darwin
            arch: arm64
            target: aarch64-apple-darwin
            timeout_minutes: 30
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      COOKBOOK_VALIDATION_TIMEOUT: '45'
      COOKBOOK_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || inputs.source || github.sha }}
    steps:
      - name: Prepare
        timeout-minutes: 20
        uses: nicodes/cookbook/prepare@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
        with:
          cookbook-ref: ${{ inputs.cookbook || '2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854' }}
          source: ${{ inputs.source || github.sha }}
          target: ${{ matrix.target }}
      - name: Build
        timeout-minutes: ${{ matrix.timeout_minutes }}
        uses: nicodes/cookbook/build@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
      - name: Test
        timeout-minutes: ${{ matrix.timeout_minutes }}
        uses: nicodes/cookbook/test@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
      - name: Finish
        if: always()
        timeout-minutes: 5
        uses: nicodes/cookbook/finish@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
        with:
          status: ${{ job.status }}
          entry: ${{ matrix.id }}
