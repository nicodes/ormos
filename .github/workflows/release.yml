# Generated cookbook caller. Change recipe data and regenerate.
# Attestation stays in this source workflow to preserve published installer trust.
name: Release
run-name: "Release · ${{ inputs.bump }}"
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      date: ${{ steps.identity.outputs.date }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: 7020748ab255d1200661e64b554419ac3839e220
      RELEASE_BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: 7020748ab255d1200661e64b554419ac3839e220
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: 7020748ab255d1200661e64b554419ac3839e220
      - name: Prepare tools
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-setup
        with:
          tools: python
      - name: Prepare pinned Rust audit tools
        timeout-minutes: 15
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-setup
        with:
          tools: python rust cargo:cargo-audit
      - name: Audit Rust lockfiles
        timeout-minutes: 15
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/native_ci.py audit --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA"
      - name: Select unused native release identity without mutation
        id: identity
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py identity --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --bump "$RELEASE_BUMP"
  build-test:
    name: Build and test (${{ matrix.platform }}-${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1-Linux-x86_64
            runner: ubuntu-24.04
            platform: Linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            timeout_minutes: 45
          - id: 1-Linux-arm64
            runner: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            timeout_minutes: 45
          - id: 1-Darwin-x86_64
            runner: macos-15-intel
            platform: Darwin
            arch: x86_64
            target: x86_64-apple-darwin
            timeout_minutes: 45
          - id: 1-Darwin-arm64
            runner: macos-15
            platform: Darwin
            arch: arm64
            target: aarch64-apple-darwin
            timeout_minutes: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      COOKBOOK_VALIDATION_TIMEOUT: '45'
      COOKBOOK_CANDIDATE_COMMIT: ${{ github.sha }}
      COOKBOOK_NATIVE_RELEASE: 'true'
    steps:
      - name: Prepare
        timeout-minutes: 20
        uses: nicodes/cookbook/prepare@7020748ab255d1200661e64b554419ac3839e220
        with:
          cookbook-ref: 7020748ab255d1200661e64b554419ac3839e220
          source: ${{ github.sha }}
          target: ${{ matrix.target }}
          version: ${{ needs.plan.outputs.version }}
          date: ${{ needs.plan.outputs.date }}
      - name: Build
        timeout-minutes: ${{ matrix.timeout_minutes }}
        uses: nicodes/cookbook/build@7020748ab255d1200661e64b554419ac3839e220
      - name: Test
        timeout-minutes: ${{ matrix.timeout_minutes }}
        uses: nicodes/cookbook/test@7020748ab255d1200661e64b554419ac3839e220
      - name: Export native packet
        timeout-minutes: 15
        uses: nicodes/cookbook/export-native@7020748ab255d1200661e64b554419ac3839e220
        with:
          entry: ${{ matrix.id }}
      - name: Finish
        if: always()
        timeout-minutes: 5
        uses: nicodes/cookbook/finish@7020748ab255d1200661e64b554419ac3839e220
        with:
          status: ${{ job.status }}
          entry: ${{ matrix.id }}
  build-test-host:
    name: Build and test (integration)
    needs: [plan, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      COOKBOOK_VALIDATION_TIMEOUT: '45'
      COOKBOOK_CANDIDATE_COMMIT: ${{ github.sha }}
      COOKBOOK_NATIVE_WAVE: host
      COOKBOOK_NATIVE_RELEASE: 'true'
    steps:
      - name: Prepare
        timeout-minutes: 20
        uses: nicodes/cookbook/prepare@7020748ab255d1200661e64b554419ac3839e220
        with:
          cookbook-ref: 7020748ab255d1200661e64b554419ac3839e220
          source: ${{ github.sha }}
          target: x86_64-unknown-linux-musl
          version: ${{ needs.plan.outputs.version }}
          date: ${{ needs.plan.outputs.date }}
          advisories: run
      - name: Import native packets
        timeout-minutes: 15
        uses: nicodes/cookbook/import-native@7020748ab255d1200661e64b554419ac3839e220
      - name: Build
        timeout-minutes: 105
        uses: nicodes/cookbook/build@7020748ab255d1200661e64b554419ac3839e220
      - name: Test
        id: test
        timeout-minutes: 105
        uses: nicodes/cookbook/test@7020748ab255d1200661e64b554419ac3839e220
      - name: Upload accepted outputs and fresh evidence
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test.outputs.artifact-paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Finish
        if: always()
        timeout-minutes: 5
        uses: nicodes/cookbook/finish@7020748ab255d1200661e64b554419ac3839e220
        with:
          status: ${{ job.status }}
  accept:
    name: Attest archives
    needs: [plan, build-test-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      artifact: ${{ steps.accepted.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: 7020748ab255d1200661e64b554419ac3839e220
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: 7020748ab255d1200661e64b554419ac3839e220
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: 7020748ab255d1200661e64b554419ac3839e220
      - name: Download this execution's complete source acceptance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/cli-input/full
      - name: Stage only closed original archive and proof data
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_inputs.py --input full
      - name: Recheck complete native and host proof and exact publication bytes
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py accept --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --tag "$RELEASE_TAG" --before-acceptance
      - name: Attest build provenance under the published source workflow identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Preserve original accepted archives and source proof
        id: accepted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-cli-archives-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            .artifacts/cookbook-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish
    needs: [plan, accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: 7020748ab255d1200661e64b554419ac3839e220
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: 7020748ab255d1200661e64b554419ac3839e220
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: 7020748ab255d1200661e64b554419ac3839e220
      - name: Download exactly the accepted caller artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.accept.outputs.artifact }}
          path: .artifacts/cli-input/publication
          merge-multiple: true
      - name: Stage only admitted release data without overlaying source or providers
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_inputs.py --input publication
      - name: Recheck exact source proof and publish immutable native bytes
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py publish --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
