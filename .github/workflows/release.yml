name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency: release-${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            case "$BUMP" in
              major) version="1.0.0" ;;
              minor) version="0.1.0" ;;
              patch) version="0.0.1" ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            goos="$1"
            goarch="$2"
            os_label="$3"
            arch_label="$4"
            name="ormos_${os_label}_${arch_label}"
            out_dir="dist/$name"
            mkdir -p "$out_dir"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$out_dir/ormos" .
            "$out_dir/ormos" --version | grep -Fx "$VERSION"
            cp README.md LICENSE "$out_dir/"
            tar -C "$out_dir" -czf "dist/$name.tar.gz" ormos README.md LICENSE
          }

          build linux  amd64 Linux  x86_64
          build linux  arm64 Linux  arm64
          build darwin amd64 Darwin x86_64
          build darwin arm64 Darwin arm64
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cat > dist/notes.md <<NOTES
          ormos $TAG

          Verify the download before running it — this binary accepts remote
          instructions to open shells on your machine:

              gh attestation verify ormos_Linux_x86_64.tar.gz --repo $GITHUB_REPOSITORY
          NOTES
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
