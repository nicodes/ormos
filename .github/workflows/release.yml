name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  darwin:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Check source
      shell: bash
      run: |-
        set -euo pipefail
        mise run lint-source
    - name: Check project
      shell: bash
      run: |-
        set -euo pipefail
        mise run install
        mise run test
        mise run vuln
  release:
    name: Release
    needs: darwin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo 'Run releases from the main branch.' >&2
          exit 1
        fi
        git fetch --tags --force
        latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          # The first release is 0.0.1 whatever was asked for. Under 0.x a
          # minor claims a milestone that has not happened, and a first
          # release is not the place to claim one. The bump choice starts
          # mattering once there is a tag to bump.
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        tag="v${version}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag already exists: $tag" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Check project
      env:
        VERSION: ${{ steps.release.outputs.version }}
        MISE_GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          dist/*.tar.gz
          dist/install.sh
    - name: "Upload artifacts"
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
          dist/install.sh
        if-no-files-found: error
        retention-days: 7
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
  publish:
    name: Publish release
    needs: release
    uses: nicodes/tools/.github/workflows/cli-publish.yml@091101094fedf5ce2e67c339c1c9c842d6a662dc
    permissions:
      contents: write
    with:
      tools-ref: 091101094fedf5ce2e67c339c1c9c842d6a662dc
      binary: ormos
      tag: ${{ needs.release.outputs.tag }}
      artifact-id: ${{ needs.release.outputs.artifact-id }}
      extra-files: install.sh
