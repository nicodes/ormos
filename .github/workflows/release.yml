name: release

# Cut a release: bump the tag, cross-compile, publish archives with checksums
# and build provenance.
#
# The tag is a PLAIN v0.0.1, not a prefixed one. This repository is the Go
# module, so `go install github.com/nicodes/ormos@v0.0.2` only resolves if the
# tag is exactly that. A prefixed tag would publish a release nobody could
# install by version, and `@latest` would go on resolving to a pseudo-version of
# whatever main happened to be.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency: release-${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
      id-token: write # OIDC identity for build provenance
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The version arithmetic below reads the tag history. A shallow clone
          # does not have it.
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            # The first release is 0.0.1 whatever was asked for. Under 0.x a
            # minor claims a milestone that has not happened, and a first
            # release is not the place to claim one. The bump choice starts
            # mattering once there is a tag to bump.
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The same steps CI runs, from the same definition. Running them again
      # against this exact commit is not redundant: CI passing on this SHA
      # earlier is a claim about that run, and a release is the artefact people
      # actually execute.
      #
      # Build before Test, as everywhere else. It costs a cross-compile of four
      # platforms on a release whose tests then fail -- and buys one ordering
      # with no exceptions to remember.
      - name: Build
        uses: ./.github/actions/build
        with:
          version: ${{ steps.release.outputs.version }}

      - name: Test
        uses: ./.github/actions/test

      # checksums.txt only says the archives match a file uploaded by whoever
      # uploaded them; provenance ties them to this workflow, this repository
      # and this commit, and `gh attestation verify` checks that against a
      # public transparency log.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cat > dist/notes.md <<NOTES
          ormos $TAG

          \`\`\`sh
          go install github.com/nicodes/ormos@$TAG
          \`\`\`

          Or take an archive below. Verify the download before running it —
          this binary accepts remote instructions to open shells on your
          machine:

          \`\`\`sh
          gh attestation verify ormos_Linux_x86_64.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
