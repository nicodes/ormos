name: Release

# Cut a release: bump the tag, cross-compile, publish archives with checksums
# and build provenance.
#
# The tag is a PLAIN v0.0.1, not a prefixed one. This repository is the Go
# module, so `go install github.com/nicodes/ormos@v0.0.2` only resolves if the
# tag is exactly that. A prefixed tag would publish a release nobody could
# install by version, and `@latest` would go on resolving to a pseudo-version of
# whatever main happened to be.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency: release-${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
      id-token: write # OIDC identity for build provenance
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The version arithmetic below reads the tag history. A shallow clone
          # does not have it.
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            # The first release is 0.0.1 whatever was asked for. Under 0.x a
            # minor claims a milestone that has not happened, and a first
            # release is not the place to claim one. The bump choice starts
            # mattering once there is a tag to bump.
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # mise rather than setup-go, so every repository in the fleet installs its
      # toolchain the same way. The cost is that the Go version now lives in
      # .mise.toml as well as go.mod; the step below is what keeps them honest.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Toolchain pins agree
        shell: bash
        run: |
          set -euo pipefail
          mod="$(sed -n 's/^go //p' go.mod | head -n1)"
          pin="$(sed -n 's/^go = "\(.*\)"$/\1/p' .mise.toml | head -n1)"
          if [ -z "$mod" ] || [ -z "$pin" ]; then
            echo "::error::could not read the Go version from go.mod ($mod) or .mise.toml ($pin)"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$mod" "$pin" | sort -V | head -n1)" != "$mod" ]; then
            echo "::error::.mise.toml pins Go $pin but go.mod asks for $mod. CI would build against the older one while GOTOOLCHAIN quietly fetched the newer, so the pin would describe nothing."
            exit 1
          fi
          echo "go.mod wants $mod, .mise.toml pins $pin"

      # What setup-go did for free. mise installs the toolchain and caches
      # nothing else, so this is what stops every run recompiling from cold.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.mise.toml') }}
          restore-keys: |
            go-${{ runner.os }}-

      # The same steps CI runs, from the same definition. Running them again
      # against this exact commit is not redundant: CI passing on this SHA
      # earlier is a claim about that run, and a release is the artefact people
      # actually execute.
      #
      # Build before Test, as everywhere else. It costs a cross-compile of four
      # platforms on a release whose tests then fail -- and buys one ordering
      # with no exceptions to remember.
      - name: Build
        uses: ./.github/actions/build
        with:
          version: ${{ steps.release.outputs.version }}

      - name: Test
        uses: ./.github/actions/test

      # checksums.txt only says the archives match a file uploaded by whoever
      # uploaded them; provenance ties them to this workflow, this repository
      # and this commit, and `gh attestation verify` checks that against a
      # public transparency log.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cat > dist/notes.md <<NOTES
          ormos $TAG

          \`\`\`sh
          go install github.com/nicodes/ormos@$TAG
          \`\`\`

          Or take an archive below. Verify the download before running it —
          this binary accepts remote instructions to open shells on your
          machine:

          \`\`\`sh
          gh attestation verify ormos_Linux_x86_64.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
