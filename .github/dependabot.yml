# What keeps this repository's third-party code current: the pinned action refs
# and the Go modules the binary builds against.
#
# Every third-party action is pinned to a commit SHA rather than a tag, which is
# the point: a tag is a moving reference, and whoever can move it can run code
# in these jobs. The cost of a SHA is that nothing tells you when it has gone
# stale -- a tag at least reads as a version. This is the thing that tells you.
# The Go pins carry the same argument: a dependency nobody is watching is a
# supply-chain hole that stays open silently.
#
# Minor and patch updates are grouped per ecosystem: they share the same risk
# profile and CI can merge them without ceremony. Major updates are deliberately
# excluded, so Dependabot opens one reviewable pull request for each
# breaking-change boundary.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The binary's Go module. go.mod is at the repository root.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
