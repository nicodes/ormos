[workspace]
members = ["relay", "vendor/yamux"]
exclude = ["api"]
resolver = "3"

[package]
name = "ormos"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
ormos-relay = { path = "relay", default-features = false }
flate2 = "1.1.10"
libc = "0.2.191"
serde_json = "1.0.154"
signal-hook = "0.4.5"
tempfile = "3.27.0"

[patch.crates-io]
yamux = { path = "vendor/yamux" }
